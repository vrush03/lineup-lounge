version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Minor and patch bumps land together in one PR; majors stay separate.
      minor-and-patch:
        update-types: [minor, patch]
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
        update-types: [major]
      dnd-kit:
        patterns: ["@dnd-kit/*"]
        update-types: [major]
      vite:
        patterns: [vite, vitest, "@vitejs/*", "@tailwindcss/vite", tailwindcss]
        update-types: [major]
    commit-message:
      prefix: deps
      prefix-development: deps-dev

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
